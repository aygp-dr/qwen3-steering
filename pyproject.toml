[project]
name = "qwen3-steering"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.51.0",
    "torch",
    "datasets",
    "accelerate>=1.13.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "scipy>=1.17.1",
    "pygame>=2.6.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "schemathesis",
    "httpx",
]
