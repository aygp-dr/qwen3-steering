// Zone definitions
function getZone(layerIndex) {
  if (layerIndex <= 7) return { name: 'Early / Drift', color: '#3b82f6', bg: 'rgba(59,130,246,0.15)', border: 'rgba(59,130,246,0.4)' };
  if (layerIndex <= 11) return { name: 'Transition', color: '#6b7280', bg: 'rgba(107,114,128,0.15)', border: 'rgba(107,114,128,0.4)' };
  if (layerIndex <= 17) return { name: 'Sweet Spot', color: '#22c55e', bg: 'rgba(34,197,94,0.15)', border: 'rgba(34,197,94,0.4)' };
  if (layerIndex <= 22) return { name: 'Formatting', color: '#f97316', bg: 'rgba(249,115,22,0.15)', border: 'rgba(249,115,22,0.4)' };
  return { name: 'Distortion', color: '#ef4444', bg: 'rgba(239,68,68,0.15)', border: 'rgba(239,68,68,0.4)' };
}

// Build full 28-layer array
const allLayers = [];
for (let i = 0; i < 28; i++) {
  const key = String(i);
  const zone = getZone(i);
  const hasMeasurement = rawData.hasOwnProperty(key);
  allLayers.push({
    index: i,
    label: 'L' + i,
    zone: zone,
    measured: hasMeasurement,
    data: hasMeasurement ? rawData[key] : null
  });
}

const metricMeta = {
  'residual_norm': { label: 'Residual Norm', unit: '', format: v => v.toFixed(1) },
  'raw_vec_norm': { label: 'Raw Vector Norm', unit: '', format: v => v.toFixed(1) },
  'snr_pct': { label: 'Signal-to-Noise Ratio', unit: '%', format: v => v.toFixed(2) + '%' },
  'avg_word_count': { label: 'Avg Word Count', unit: 'words', format: v => v.toFixed(0) },
  'avg_topic_cosine': { label: 'Topic Cosine Similarity', unit: '', format: v => v.toFixed(3) },
  'avg_words_per_sentence': { label: 'Words per Sentence', unit: '', format: v => v.toFixed(1) },
  'avg_markdown_density': { label: 'Markdown Density', unit: '%', format: v => v.toFixed(2) + '%' },
  'avg_perplexity_ratio': { label: 'Perplexity Ratio', unit: 'x', format: v => v === null ? 'N/A' : v.toFixed(3) }
};

function getMetricValue(layer, metric) {
  if (!layer.data) return null;
  if (['residual_norm', 'raw_vec_norm', 'snr_pct'].includes(metric)) {
    return layer.data[metric];
  }
  return layer.data[metric];
}

function buildChart(metric) {
  const meta = metricMeta[metric];
  const labels = allLayers.map(l => l.label);
  const values = allLayers.map(l => getMetricValue(l, metric));
  const colors = allLayers.map(l => {
    if (!l.measured) return '#21262d';
    return l.zone.color;
  });
  const borderColors = allLayers.map(l => {
    if (!l.measured) return '#30363d';
    if (l.index >= 12 && l.index <= 17) return '#22c55e';
    return l.zone.color;
  });
  const borderWidths = allLayers.map(l => {
    if (l.index >= 12 && l.index <= 17 && l.measured) return 2;
    return 0;
  });
  const opacities = allLayers.map(l => l.measured ? 0.85 : 0.2);

  const hoverTexts = allLayers.map(l => {
    if (!l.measured) return `<b>${l.label}</b><br>Zone: ${l.zone.name}<br><i>Not measured</i>`;
    const val = getMetricValue(l, metric);
    const formattedVal = val !== null && val !== undefined && isFinite(val) ? meta.format(val) : 'N/A';
    return `<b>${l.label}</b><br>Zone: ${l.zone.name}<br>Role: ${l.data.classified_role}<br>${meta.label}: ${formattedVal}<br><i>Click for details</i>`;
  });

  // Sweet spot annotation band
  const shapes = [
    {
      type: 'rect',
      xref: 'x',
      yref: 'paper',
      x0: 11.5,
      x1: 17.5,
      y0: 0,
      y1: 1,
      fillcolor: 'rgba(34, 197, 94, 0.06)',
      line: { color: 'rgba(34, 197, 94, 0.2)', width: 1, dash: 'dot' }
    }
  ];

  const annotations = [
    {
      x: 14.5,
      y: 1.02,
      xref: 'x',
      yref: 'paper',
      text: 'SWEET SPOT',
      showarrow: false,
      font: { color: '#22c55e', size: 11, family: 'monospace' },
      bgcolor: 'rgba(34,197,94,0.1)',
      bordercolor: 'rgba(34,197,94,0.3)',
      borderwidth: 1,
      borderpad: 4
    }
  ];

  const barTrace = {
    x: labels,
    y: values.map(v => (v === null || v === undefined || !isFinite(v)) ? 0 : v),
    type: 'bar',
    marker: {
      color: colors,
      opacity: opacities,
      line: {
        color: borderColors,
        width: borderWidths
      }
    },
    hovertext: hoverTexts,
    hoverinfo: 'text',
    hoverlabel: {
      bgcolor: '#161b22',
      bordercolor: '#30363d',
      font: { color: '#c9d1d9', size: 12 }
    }
  };

  const layout = {
    paper_bgcolor: '#0d1117',
    plot_bgcolor: '#0d1117',
    font: { color: '#c9d1d9', family: 'Segoe UI, -apple-system, sans-serif' },
    margin: { t: 40, r: 20, b: 60, l: 70 },
    xaxis: {
      title: { text: 'Transformer Layer', font: { size: 13, color: '#8b949e' } },
      tickfont: { size: 11 },
      gridcolor: '#21262d',
      linecolor: '#30363d'
    },
    yaxis: {
      title: { text: meta.label + (meta.unit ? ' (' + meta.unit + ')' : ''), font: { size: 13, color: '#8b949e' } },
      tickfont: { size: 11 },
      gridcolor: '#21262d',
      linecolor: '#30363d',
      zeroline: true,
      zerolinecolor: '#30363d'
    },
    shapes: shapes,
    annotations: annotations,
    bargap: 0.15,
    hoverdistance: 20
  };

  const config = {
    responsive: true,
    displayModeBar: true,
    modeBarButtonsToRemove: ['lasso2d', 'select2d'],
    displaylogo: false
  };

  Plotly.newPlot('main-chart', [barTrace], layout, config);

  // Click handler
  document.getElementById('main-chart').on('plotly_click', function(eventData) {
    const pointIndex = eventData.points[0].pointIndex;
    showDetail(allLayers[pointIndex]);
  });
}

function showDetail(layer) {
  const panel = document.getElementById('detail-panel');

  if (!layer.measured) {
    panel.innerHTML = `
      <h2>Layer ${layer.index} Detail</h2>
      <div class="zone-badge" style="background:${layer.zone.bg};color:${layer.zone.color};border:1px solid ${layer.zone.border}">
        ${layer.zone.name}
      </div>
      <div class="no-selection">No measurement data collected for this layer.</div>
    `;
    return;
  }

  const data = layer.data;
  const isSweetSpot = layer.index >= 12 && layer.index <= 17;

  let html = `<h2>Layer ${layer.index} Detail</h2>`;

  html += `<div class="zone-badge" style="background:${layer.zone.bg};color:${layer.zone.color};border:1px solid ${layer.zone.border}">
    ${layer.zone.name}
  </div>`;

  if (isSweetSpot) {
    html += `<div class="sweet-spot-indicator">This layer is in the steering sweet spot (L12-L17). Strong style shift with maintained coherence.</div>`;
  }

  // Role
  html += `<div class="metric-row"><span class="metric-label">Classified Role</span><span class="metric-value">${data.classified_role}</span></div>`;

  // All metrics
  const allMetrics = [
    ['Residual Norm', data.residual_norm, v => v.toFixed(1)],
    ['Raw Vec Norm', data.raw_vec_norm, v => v.toFixed(1)],
    ['SNR', data.snr_pct, v => v.toFixed(2) + '%'],
    ['Avg Word Count', data.avg_word_count, v => v.toFixed(0)],
    ['Topic Cosine', data.avg_topic_cosine, v => v.toFixed(3)],
    ['Words/Sentence', data.avg_words_per_sentence, v => v.toFixed(1)],
    ['Markdown Density', data.avg_markdown_density, v => v.toFixed(2) + '%'],
    ['Perplexity Ratio', data.avg_perplexity_ratio, v => (v === null || !isFinite(v)) ? 'Inf' : v.toFixed(3)]
  ];

  for (const [label, value, fmt] of allMetrics) {
    const displayVal = (value === null || value === undefined || !isFinite(value)) ? 'N/A' : fmt(value);
    html += `<div class="metric-row"><span class="metric-label">${label}</span><span class="metric-value">${displayVal}</span></div>`;
  }

  // Empirical note
  html += `<div class="metric-row"><span class="metric-label">Note</span><span class="metric-value" style="font-size:11px;font-weight:400;max-width:200px;text-align:right">${data.empirical_note}</span></div>`;

  // Per-prompt previews
  if (data.per_prompt && data.per_prompt.length > 0) {
    html += `<div style="margin-top:16px"><h2 style="font-size:14px;margin-bottom:8px">Response Previews</h2>`;
    const promptLabels = ['Mutex prompt', 'Photosynthesis prompt'];
    data.per_prompt.forEach((pp, idx) => {
      const previewText = pp.text_preview || '(empty output)';
      html += `<div class="preview-box">
        <div class="preview-label">${promptLabels[idx] || 'Prompt ' + (idx+1)}</div>
        ${previewText}
        <div style="margin-top:8px;font-size:11px;color:#484f58">
          words=${pp.word_count} | cos=${pp.topic_cosine.toFixed(3)} | ppl=${(pp.perplexity_ratio === null || !isFinite(pp.perplexity_ratio)) ? 'Inf' : pp.perplexity_ratio.toFixed(2)}
        </div>
      </div>`;
    });
    html += '</div>';
  }

  panel.innerHTML = html;
}

// Init
const metricSelect = document.getElementById('metric-select');
buildChart(metricSelect.value);

metricSelect.addEventListener('change', function() {
  buildChart(this.value);
});

// Keyboard nav
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    // Find the currently selected layer from the detail panel
    const h2 = document.querySelector('#detail-panel h2');
    if (!h2) return;
    const match = h2.textContent.match(/Layer (\d+)/);
    if (!match) return;
    let currentIndex = parseInt(match[1]);
    if (e.key === 'ArrowLeft') currentIndex = Math.max(0, currentIndex - 1);
    if (e.key === 'ArrowRight') currentIndex = Math.min(27, currentIndex + 1);
    showDetail(allLayers[currentIndex]);
  }
});
</script>
</body>
</html>
